<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Styling untuk container peta utama */
    .map-wrapper {
      position: relative;
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
    }
    .map-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    /* Styling kartu melayang agar posisinya terkunci di sekitar peta */
    .floating-card {
      position: absolute;
      width: 230px;
      font-size: 11px;
      z-index: 10;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 p-4">
  <div class="max-w-7xl mx-auto">
    
    <!-- HEADER & FILTER LENGKAP -->
    <header class="flex flex-col md:flex-row justify-between items-center bg-slate-800 border border-slate-700 p-4 rounded-lg shadow-lg mb-4 gap-4">
      <div class="flex items-center space-x-3">
        <div class="flex items-center space-x-2 border-r border-slate-600 pr-4">
          <span class="font-black text-xl tracking-wider text-blue-400">PLN</span>
        </div>
        <div>
          <h1 class="font-bold text-base text-white">PETA SUSUT UP3 PAREPARE</h1>
          <p class="text-xs text-slate-400">Monitoring Susut Distribusi</p>
        </div>
      </div>

      <div class="flex flex-wrap gap-3 text-sm items-center">
        <!-- FILTER KUM (BULANAN / KUMULATIF) -->
        <div>
          <label class="text-xs font-semibold mr-1 text-slate-300">TIPE:</label>
          <select id="filterKum" class="border border-slate-600 p-1 rounded bg-slate-900 text-white text-xs font-medium focus:outline-none focus:border-blue-500" onchange="loadData()">
            <option value="BULANAN">BULANAN</option>
            <option value="KUMULATIF" selected>KUMULATIF</option>
          </select>
        </div>

        <!-- FILTER BULAN -->
        <div>
          <label class="text-xs font-semibold mr-1 text-slate-300">BULAN:</label>
          <select id="filterBulan" class="border border-slate-600 p-1 rounded bg-slate-900 text-white text-xs font-medium focus:outline-none focus:border-blue-500" onchange="loadData()">
            <option value="01 JANUARI">01 JANUARI</option>
            <option value="02 FEBRUARI">02 FEBRUARI</option>
            <option value="03 MARET">03 MARET</option>
            <option value="04 APRIL">04 APRIL</option>
            <option value="05 MEI">05 MEI</option>
            <option value="06 JUNI">06 JUNI</option>
            <option value="07 JULI">07 JULI</option>
            <option value="08 AGUSTUS">08 AGUSTUS</option>
            <option value="09 SEPTEMBER">09 SEPTEMBER</option>
            <option value="10 OKTOBER">10 OKTOBER</option>
            <option value="11 NOVEMBER">11 NOVEMBER</option>
            <option value="12 DESEMBER">12 DESEMBER</option>
          </select>
        </div>

        <!-- FILTER TAHUN -->
        <div>
          <label class="text-xs font-semibold mr-1 text-slate-300">TAHUN:</label>
          <select id="filterTahun" class="border border-slate-600 p-1 rounded bg-slate-900 text-white text-xs font-medium focus:outline-none focus:border-blue-500" onchange="loadData()">
            <option value="2025">2025</option>
            <option value="2026" selected>2026</option>
          </select>
        </div>
      </div>
    </header>

    <!-- KANVAS PETA & KARTU MELAYANG -->
    <div class="bg-slate-800 border border-slate-700 rounded-lg shadow-xl p-6 relative mb-4">
      <div class="map-wrapper">
        
        <!-- GAMBAR PETA UTAMA -->
        <img src="https://lh3.googleusercontent.com/d/1YVLUXNZQxOTjLpkGCNrCaDgGaf9kl_v7" alt="Peta UP3 Parepare">

        <!-- POSISI KARTU STATISTIK -->
        <div id="card-RAPPANG" class="floating-card" style="top: 10%; left: 5%;"></div>
        <div id="card-MATTIROTASI" class="floating-card" style="top: 40%; left: 1%;"></div>
        <div id="card-BARRU" class="floating-card" style="top: 70%; left: 3%;"></div>
        
        <div id="card-TANRU TEDONG" class="floating-card" style="top: 1%; right: 30%;"></div>
        <div id="card-PANGSID" class="floating-card" style="top: 25%; right: 15%;"></div>
        <div id="card-SOPPENG" class="floating-card" style="top: 50%; right: 20%;"></div>
        <div id="card-PAJALESANG" class="floating-card" style="top: 75%; right: 25%;"></div>

        <!-- KARTU TOTAL UP3 PAREPARE DI POJOK KANAN BAWAH -->
        <div id="card-UP3 PAREPARE" class="floating-card" style="top: 1%; right: 1%; width: 250px;"></div>

      </div>
    </div>

    <!-- CONTAINER BARU: RINGKASAN % TANPA EM1N, TARGET & PENCAPAIAN -->
    <div class="bg-slate-800 border border-slate-700 rounded-lg shadow-xl p-4">
      <h2 class="text-sm font-bold text-white mb-3 tracking-wide uppercase border-b border-slate-700 pb-2">
        Rekapitulasi Susut, Target & Pencapaian
      </h2>
      <div id="summary-persen-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3">
        <!-- Akan diisi secara dinamis oleh JavaScript -->
      </div>
    </div>

  </div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyg76R1_mguiVA59M5ZZBh19RJuxkrAUZAoBh5pw37bzlLj4GgZV9xN8_0ccRRLsOc8Yg/exec";

  // Objek penampung cache di sisi browser
  const memoryCache = {};

  window.onload = function() {
    loadData();
  };

  function loadData() {
    var tahun = document.getElementById('filterTahun').value;
    var bulan = document.getElementById('filterBulan').value;
    var kum = document.getElementById('filterKum').value;

    var cacheKey = `${tahun}_${bulan}_${kum}`;

    if (memoryCache[cacheKey]) {
      console.log("Memuat data dari Cache Browser (Instan)...");
      renderAll(memoryCache[cacheKey]);
      return;
    }

    console.log("Memuat data baru dari Google Sheets...");

    var url = `${WEB_APP_URL}?tahun=${tahun}&bulan=${encodeURIComponent(bulan)}&kum=${encodeURIComponent(kum)}`;

    fetch(url)
      .then(response => response.json())
      .then(data => {
        memoryCache[cacheKey] = data;
        renderAll(data);
      })
      .catch(error => {
        console.error('Terjadi kesalahan saat mengambil data:', error);
      });
  }

  function renderAll(data) {
    renderFloatingCards(data);
    renderSummaryPersen(data);
  }

  function renderFloatingCards(data) {
    var unitList = ['RAPPANG', 'MATTIROTASI', 'BARRU', 'TANRU TEDONG', 'PANGSID', 'SOPPENG', 'PAJALESANG', 'UP3 PAREPARE'];
    
    unitList.forEach(function(unit) {
      var container = document.getElementById('card-' + unit);
      if (container) {
        container.innerHTML = '';
      }
    });

    if (!data || data.length === 0) return;

    var allowedKet = [
      "A. S1AP SALUR DIST",
      "B. KWH JUAL TANPA EM1N",
      "C. SUSUT TANPA EM1N",
      "D. % TANPA EM1N"
    ];

    var filteredData = data.filter(function(item) {
      return allowedKet.includes(item.ket.trim());
    });

    var groupedByUnit = {};
    filteredData.forEach(function(item) {
      if (!groupedByUnit[item.unit]) {
        groupedByUnit[item.unit] = [];
      }
      groupedByUnit[item.unit].push(item);
    });

    for (var unit in groupedByUnit) {
      var container = document.getElementById('card-' + unit);
      if (container) {
        container.innerHTML = createCardHTML(unit, groupedByUnit[unit]);
      }
    }
  }

  function createCardHTML(unit, rows) {
    var isTotal = (unit === 'UP3 PAREPARE');
    var headerClass = isTotal ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-blue-600 text-white font-bold';
    var containerClass = isTotal ? 'bg-slate-900 text-slate-100 border-2 border-amber-500 shadow-2xl' : 'bg-slate-900 text-slate-100 border border-slate-700 shadow-lg';

    var html = `<div class="${containerClass} rounded overflow-hidden">`;
    html += `<div class="${headerClass} px-2 py-1 uppercase flex justify-between tracking-wide text-xs"><span>${unit}</span><span>▲</span></div>`;
    html += `<div class="p-1.5 space-y-0.5">`;

    rows.forEach(function(row) {
      var formattedNilai = Number(row.nilai).toLocaleString('id-ID');
      html += `<div class="flex justify-between border-b border-slate-800 pb-0.5 text-[11px]">
                 <span class="truncate w-32 text-slate-300" title="${row.ket}">${row.ket}</span>
                 <span class="font-semibold text-white">${formattedNilai}</span>
               </div>`;
    });

    html += `</div></div>`;
    return html;
  }

  // Fungsi untuk mendapatkan warna berdasarkan conditional formatting nilai % TANPA EM1N
  function getConditionalColor(val) {
    var num = parseFloat(val);
    if (isNaN(num)) return 'bg-slate-700 text-white';

    if (num >= 13) {
      return 'bg-black text-white border border-slate-600'; // Hitam
    } else if (num >= 10) {
      return 'bg-red-600 text-white'; // Merah
    } else if (num >= 7) {
      return 'bg-emerald-600 text-white'; // Hijau
    } else if (num >= 5) {
      return 'bg-amber-500 text-slate-950 font-bold'; // Gold
    } else if (num >= 0) {
      return 'bg-slate-200 text-slate-950 font-semibold'; // Platinum
    } else {
      return 'bg-slate-700 text-white';
    }
  }

  // Fungsi untuk merender container rekapitulasi persentase, target, dan pencapaian
  function renderSummaryPersen(data) {
    var summaryContainer = document.getElementById('summary-persen-container');
    summaryContainer.innerHTML = '';

    if (!data || data.length === 0) {
      summaryContainer.innerHTML = '<p class="text-xs text-slate-400 col-span-full">Tidak ada data.</p>';
      return;
    }

    // Filter khusus baris "D. % TANPA EM1N"
    var persenData = data.filter(function(item) {
      return item.ket.trim() === "D. % TANPA EM1N";
    });

    if (persenData.length === 0) {
      summaryContainer.innerHTML = '<p class="text-xs text-slate-400 col-span-full">Data persentase tidak ditemukan.</p>';
      return;
    }

    persenData.forEach(function(row) {
      var aktual = parseFloat(row.nilai) || 0;
      var target = parseFloat(row.target) || 0;
      
      // Perhitungan Persen Pencapaian dengan Polaritas Negatif:
      // Rumus Polaritas Negatif: (Target / Aktual) * 100%
      // Jika aktual lebih kecil dari target, pencapaian > 100% (bagus).
      // Jika aktual lebih besar dari target, pencapaian < 100% (kurang).
      var persenPencapaian = 0;
      if (aktual > 0) {
        persenPencapaian = (target / aktual) * 100;
      } else if (target === 0) {
        persenPencapaian = 100;
      }

      var colorClass = getConditionalColor(aktual);
      var formattedAktual = aktual.toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      var formattedTarget = target.toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      var formattedPencapaian = persenPencapaian.toLocaleString('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

      var cardHtml = `
        <div class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 flex flex-col justify-between shadow">
          <span class="text-[11px] font-bold text-slate-300 truncate uppercase mb-2 border-b border-slate-800 pb-1">${row.unit}</span>
          
          <div class="space-y-1.5 my-1 text-[11px]">
            <div class="flex justify-between text-slate-400">
              <span>Target:</span>
              <span class="font-medium text-white">${formattedTarget}</span>
            </div>
            <div class="flex justify-between text-slate-400">
              <span>Pencapaian:</span>
              <span class="font-semibold text-blue-400">${formattedPencapaian}%</span>
            </div>
          </div>

          <div class="mt-1">
            <span class="text-[10px] text-slate-400 block mb-0.5">Nilai Susut:</span>
            <div class="${colorClass} rounded p-1.5 text-center text-xs font-bold transition-colors duration-200">
              ${formattedAktual}
            </div>
          </div>
        </div>
      `;
      summaryContainer.innerHTML += cardHtml;
    });
  }
</script>
</body>
</html>
